      - name: Browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libgbm1 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install
        working-directory: hotel-story
        run: npm install

      - name: Test frames first
        working-directory: hotel-story
        run: npx remotion render src/index.jsx Hotel out/test.mp4 --frames=0-29 --gl=swangle --image-format=jpeg

      - name: Render full video (silent)
        working-directory: hotel-story
        run: npx remotion render src/index.jsx Hotel out/full_silent.mp4 --gl=swangle --concurrency=4 --image-format=jpeg --jpeg-quality=92 --crf=17

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: hotel-story/out/*.mp4
